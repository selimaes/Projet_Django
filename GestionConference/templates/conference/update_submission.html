{% extends 'base.html' %}
{% block content %}
<h2>Modifier la soumission</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Mettre à jour</button>
</form>

<a href="{% url 'list_submissions' %}" class="btn btn-secondary mt-2">Retour à la liste</a>
{% endblock %}
